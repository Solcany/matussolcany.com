---
baseURL: "/"
locale: en-us
Title: Matúš Solčány
theme:
  - hugo-video
  - matussolcany
disableKinds:
  - "taxonomy"
  - "term"
  - "sitemap"

build:
  buildStats:
    enable: true
  cachebusters:
    - source: assets/notwatching/hugo_stats\.json
      target: css
    - source: (postcss|tailwind)\.config\.js
      target: css

module:
  mounts:
    - source: assets
      target: assets
    - source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
      disableWatch: true

markup:
  goldmark:
    renderer:
      unsafe: true

params:
    Author: Matúš Solčány
    Description: The portfolio of digital designer and creative coder Matúš Solčány
    SiteURL: "https://matussolcany.com"
    showcaseColumns: 2
    projectCategories:
    - interactive
    - visual
    - informative
---
