<!doctype html>
<html lang="en-us">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon.png" />
		<link rel="preload" href="%sveltekit.assets%/fonts/Satoshi-Regular.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/Author-Bold.woff2" as="font" type="font/woff2" crossorigin />
		<script>
			document.documentElement.classList.add('js');
			for (const type of ['load', 'loadedmetadata', 'error']) {
				document.addEventListener(
					type,
					({ target }) => {
						if (!(target instanceof HTMLImageElement || target instanceof HTMLVideoElement)) return;
						target.classList.add('loaded');
					},
					true
				);
			}
		</script>
		%sveltekit.head%
	</head>
	<body class="flex min-h-screen min-w-80 flex-col bg-paper leading-body text-ink wrap-break-word selection:bg-highlight">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
